<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Head -->
  <circle cx="100" cy="100" r="85" fill="#FFF4E6" stroke="#003D99" stroke-width="8"/>

  <!-- Face shade -->
  <ellipse cx="70" cy="100" rx="35" ry="70" fill="#FFD699" opacity="0.6"/>

  <!-- Left ear -->
  <circle cx="30" cy="85" r="20" fill="#FFF4E6" stroke="#003D99" stroke-width="8"/>

  <!-- Right ear -->
  <circle cx="170" cy="85" r="20" fill="#FFF4E6" stroke="#003D99" stroke-width="8"/>

  <!-- Hair tuft -->
  <circle cx="100" cy="35" r="28" fill="#E07856" stroke="#003D99" stroke-width="8"/>

  <!-- Left eye -->
  <path d="M 75 90 Q 80 100 85 90" fill="none" stroke="#003D99" stroke-width="6" stroke-linecap="round"/>

  <!-- Right eye -->
  <path d="M 115 90 Q 120 100 125 90" fill="none" stroke="#003D99" stroke-width="6" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M 85 120 Q 100 135 115 120" fill="none" stroke="#003D99" stroke-width="6" stroke-linecap="round"/>
</svg>