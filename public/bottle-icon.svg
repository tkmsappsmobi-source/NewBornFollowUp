<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 200" fill="none">
  <!-- Nipple tip -->
  <ellipse cx="60" cy="12" rx="8" ry="12" fill="#e8e8e8" opacity="0.95"/>
  <ellipse cx="60" cy="12" rx="6" ry="10" fill="#d4d4d4" opacity="0.9"/>
  <!-- Nipple base / collar -->
  <rect x="38" y="20" width="44" height="14" rx="7" fill="#e0e0e0"/>
  <rect x="38" y="20" width="44" height="14" rx="7" fill="url(#collarGrad)"/>
  <!-- Cap ring -->
  <rect x="34" y="33" width="52" height="10" rx="5" fill="#c8c8c8"/>
  <rect x="34" y="33" width="52" height="10" rx="5" fill="url(#capGrad)"/>

  <!-- Body outline (bottle shape) -->
  <path d="
    M 42 43
    L 36 62
    C 22 78 18 92 18 110
    C 18 145 22 165 30 175
    C 36 183 46 188 60 188
    C 74 188 84 183 90 175
    C 98 165 102 145 102 110
    C 102 92 98 78 84 62
    L 78 43
    Z
  " fill="url(#bodyGrad)" stroke="#c0d0db" stroke-width="1.5"/>

  <!-- Milk fill -->
  <clipPath id="bottleClip">
    <path d="M 42 43 L 36 62 C 22 78 18 92 18 110 C 18 145 22 165 30 175 C 36 183 46 188 60 188 C 74 188 84 183 90 175 C 98 165 102 145 102 110 C 102 92 98 78 84 62 L 78 43 Z"/>
  </clipPath>
  <rect x="18" y="90" width="84" height="100" fill="#f5f0e0" clip-path="url(#bottleClip)"/>
  <rect x="18" y="88" width="84" height="6" rx="2" fill="#e8e2cc" clip-path="url(#bottleClip)" opacity="0.8"/>

  <!-- Measurement lines -->
  <line x1="75" y1="108" x2="88" y2="108" stroke="#a8b8c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="122" x2="88" y2="122" stroke="#a8b8c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="136" x2="88" y2="136" stroke="#a8b8c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="150" x2="88" y2="150" stroke="#a8b8c4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="75" y1="164" x2="88" y2="164" stroke="#a8b8c4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Highlight left -->
  <path d="M 32 70 C 28 85 25 100 25 118 C 25 140 28 158 34 170" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.45" fill="none"/>
  <!-- Highlight small -->
  <ellipse cx="35" cy="78" rx="4" ry="8" fill="white" opacity="0.3" transform="rotate(-15 35 78)"/>

  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dce8f0" stop-opacity="0.85"/>
      <stop offset="30%" stop-color="#eef5fa" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#eef5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c8dae6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90d4"/>
      <stop offset="100%" stop-color="#2c6aaa"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a9ee0"/>
      <stop offset="100%" stop-color="#3070c0"/>
    </linearGradient>
  </defs>
</svg>
